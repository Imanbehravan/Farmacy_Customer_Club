name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: pharmacy-web

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pharmacy_club
          POSTGRES_USER: pharmacy_user
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pharmacy_user -d pharmacy_club"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: pharmacy_club
      POSTGRES_USER: pharmacy_user
      POSTGRES_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libglib2.0-0 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b shared-mime-info

      - run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test apps.accounts.tests -v 2

  build-and-deploy:
    name: Build & Deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pharmacy' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress image
        run: gzip -1 /tmp/image.tar

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS تنظیم نشده؛ از ssh-keyscan استفاده می‌شود (امن‌تر است secret تنظیم شود)."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload release
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o ServerAliveInterval=30"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/incoming'"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            /tmp/image.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/incoming/image.tar.gz"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/incoming/docker-compose.prod.yml"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/deploy.sh "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/incoming/deploy.sh"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/incoming/deploy.sh' '$TAG'"
