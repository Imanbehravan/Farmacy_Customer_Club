{% load static %}
<div class="install-banner" id="installBanner" data-install-banner>
    <img src="{% static 'icons/icon-192.png' %}" alt="">
    <div>
        <strong>نصب اپلیکیشن باشگاه مشتریان</strong>
        <small>دسترسی سریع‌تر و دریافت اعلان‌ها روی گوشی و سیستم</small>
    </div>
    <button type="button" class="btn btn-primary" data-pwa-install>نصب</button>
    <button type="button" class="x" data-install-dismiss aria-label="بستن">&times;</button>
</div>
<div class="ios-steps" data-ios-steps>
    <strong>نصب روی آیفون / آیپد:</strong><br>
    ۱) در مرورگر <b>Safari</b> دکمه‌ی اشتراک‌گذاری <i class="fas fa-arrow-up-from-bracket"></i> را بزنید.<br>
    ۲) گزینه‌ی <b>Add to Home Screen (افزودن به صفحه‌ی اصلی)</b> را انتخاب کنید.<br>
    ۳) اپ را از صفحه‌ی اصلی باز کنید و سپس اعلان‌ها را فعال کنید.
</div>
