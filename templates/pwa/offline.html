{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    {% include 'partials/pwa_head.html' %}
    <title>آفلاین | باشگاه مشتریان</title>
    <style>
        @font-face { font-family: 'Vazirmatn'; src: url('/static/fonts/Vazirmatn-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
        * { box-sizing: border-box; margin: 0; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #f7f9f1; color: #171a13; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; text-align: center; }
        .card { max-width: 380px; background: #fff; border: 1px solid #dfe6d1; border-radius: 28px; padding: 2.2rem 1.6rem; }
        img { width: 84px; height: 84px; object-fit: contain; margin: 0 auto 1.2rem; border-radius: 22px; }
        h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: .5rem; }
        p { font-size: .88rem; color: #6a7260; line-height: 1.9; margin-bottom: 1.4rem; }
        button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: #4e7034; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="{% static 'img/logo.png' %}" alt="logo">
        <h1>اتصال به اینترنت برقرار نیست</h1>
        <p>برای استفاده از باشگاه مشتریان به اینترنت نیاز است. اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
        <button onclick="location.reload()">تلاش دوباره</button>
    </div>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
