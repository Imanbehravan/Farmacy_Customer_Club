# نسخه‌ی پروداکشن — توسط CI/CD روی سرور اجرا می‌شود (docker-compose.yml قدیمی برای توسعه‌ی محلی است).
# تفاوت‌ها با نسخه‌ی توسعه:
#   * به‌جای build روی سرور، ایمیج آماده‌ی ساخته‌شده در GitHub Actions استفاده می‌شود
#   * سورس‌کد bind-mount نمی‌شود (ایمیج خودش کد را دارد)
#   * makemigrations اجرا نمی‌شود؛ فقط migrate (مایگریشن‌ها داخل مخزن commit هستند)
#   * پورت 8000 بیرون باز نمی‌شود؛ فقط nginx روی 80 و 443 در دسترس است
#   * ایمیج‌های پایه از میرور public.ecr.aws هستند (مثل سرور فعلی)
#   * nginx.conf (با تنظیمات SSL) روی خود سرور نگهداری می‌شود و توسط CI عوض نمی‌شود
services:
  db:
    image: public.ecr.aws/docker/library/postgres:15-alpine
    container_name: pharmacy_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy_club}
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmacy_pass_2024}
    networks:
      - pharmacy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacy_user} -d ${POSTGRES_DB:-pharmacy_club}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: pharmacy_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - pharmacy_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: pharmacy-web:${WEB_TAG:?WEB_TAG is required}
    container_name: pharmacy_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pharmacy_network

  nginx:
    image: public.ecr.aws/docker/library/nginx:1.25-alpine
    container_name: pharmacy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - pharmacy_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  pharmacy_network:
    driver: bridge
